<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laboratorio Digital de Blasones</title>
<meta name="description" content="Herramienta interactiva y pedagógica de diseño heráldico: compón escudos, tinturas y figuras, genera el blasonamiento y descubre su interpretación simbólica." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================================
   LABORATORIO DIGITAL DE BLASONES — Sistema de diseño
   Tema oscuro editorial · acentos dorado/cobre/plata · alto contraste
   ========================================================================== */
:root {
  /* Superficies */
  --fondo: #0d0d0f;
  --fondo-2: #131317;
  --fondo-3: #1a1a20;
  --panel: #16161c;
  --panel-borde: #26262f;
  --panel-elev: #1e1e26;
  --lienzo: #101015;
  --lienzo-vinieta: #08080a;

  /* Acentos heráldicos */
  --oro: #d4a853;
  --oro-claro: #f0cd7e;
  --oro-tenue: rgba(212, 168, 83, 0.14);
  --cobre: #b87333;
  --plata: #c9ccd4;
  --plata-tenue: rgba(201, 204, 212, 0.1);

  /* Texto */
  --texto: #ece9e2;
  --texto-2: #b7b4ad;
  --texto-3: #7d7a75;
  --texto-inv: #12100b;

  /* Estados */
  --exito: #4caf7d;
  --aviso: #e0a941;
  --peligro: #d1584f;
  --peligro-tenue: rgba(209, 88, 79, 0.14);

  /* Métrica */
  --r-s: 7px;
  --r-m: 11px;
  --r-l: 16px;
  --sombra: 0 10px 34px rgba(0, 0, 0, 0.5);
  --sombra-s: 0 3px 12px rgba(0, 0, 0, 0.4);
  --anillo: 0 0 0 2px rgba(212, 168, 83, 0.55);
  --trans: 180ms cubic-bezier(0.22, 0.61, 0.36, 1);

  --f-titulo: "Playfair Display", Georgia, serif;
  --f-ui: "Inter", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--f-ui);
  background: var(--fondo);
  color: var(--texto);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2c2c36; border-radius: 20px; border: 2px solid var(--panel); }
::-webkit-scrollbar-thumb:hover { background: #3a3a46; }
button { font-family: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--anillo); border-radius: var(--r-s); }

/* ---------- Estructura general ---------- */
#app {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 100vh;
  height: 100dvh;
}

/* ---------- Cabecera ---------- */
.cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 22px;
  background: linear-gradient(180deg, #17171d 0%, #101014 100%);
  border-bottom: 1px solid var(--panel-borde);
  flex-wrap: wrap;
}
.marca { display: flex; align-items: center; gap: 15px; min-width: 0; }
.marca .sello {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a2a33, #121216);
  border: 1px solid var(--oro);
  box-shadow: inset 0 0 12px rgba(212, 168, 83, 0.25), var(--sombra-s);
}
.marca .sello svg { width: 26px; height: 26px; }
.marca h1 {
  font-family: var(--f-titulo);
  font-weight: 900;
  font-size: 1.28rem;
  letter-spacing: 0.2px;
  line-height: 1.05;
  background: linear-gradient(92deg, var(--oro-claro), var(--oro) 55%, var(--cobre));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.marca p { font-size: 0.74rem; color: var(--texto-3); letter-spacing: 0.5px; text-transform: uppercase; }
.acciones-cabecera { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px;
  background: var(--panel-elev);
  border: 1px solid var(--panel-borde);
  border-radius: var(--r-s);
  color: var(--texto-2);
  font-size: 0.8rem; font-weight: 600;
  transition: var(--trans);
  white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; }
.btn:hover { background: var(--fondo-3); color: var(--texto); border-color: #3a3a46; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primario {
  background: linear-gradient(180deg, var(--oro), var(--cobre));
  color: var(--texto-inv);
  border-color: var(--oro);
}
.btn.primario:hover { filter: brightness(1.08); }
.btn.fantasma { background: transparent; }
.btn.activo { background: var(--oro-tenue); color: var(--oro-claro); border-color: rgba(212,168,83,0.5); }
.btn.peligro:hover { background: var(--peligro-tenue); color: var(--peligro); border-color: var(--peligro); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ---------- Barra de herramientas ---------- */
.barra-herramientas {
  display: flex; align-items: center; gap: 4px;
  padding: 7px 16px;
  background: var(--fondo-2);
  border-bottom: 1px solid var(--panel-borde);
  overflow-x: auto;
}
.barra-herramientas .sep { width: 1px; align-self: stretch; background: var(--panel-borde); margin: 3px 6px; flex: none; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 10px; border-radius: var(--r-s);
  background: transparent; border: 1px solid transparent;
  color: var(--texto-2); font-size: 0.78rem; font-weight: 600;
  transition: var(--trans); white-space: nowrap;
}
.tbtn svg { width: 16px; height: 16px; }
.tbtn:hover { background: var(--fondo-3); color: var(--texto); }
.tbtn.activo { background: var(--oro-tenue); color: var(--oro-claro); box-shadow: inset 0 0 0 1px rgba(212,168,83,0.4); }
.tbtn:disabled { opacity: 0.35; cursor: not-allowed; }
.zoom-nivel { font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; font-size: 0.78rem; color: var(--texto-2); font-weight: 600; }

/* ---------- Área de trabajo (3 columnas) ---------- */
.area-trabajo {
  display: grid;
  grid-template-columns: 268px 1fr 312px;
  min-height: 0;
  overflow: hidden;
}
.panel {
  background: var(--panel);
  display: flex; flex-direction: column;
  min-height: 0;
}
.panel-izq { border-right: 1px solid var(--panel-borde); }
.panel-der { border-left: 1px solid var(--panel-borde); }
.panel-cabecera {
  padding: 11px 14px 9px;
  font-family: var(--f-titulo);
  font-weight: 700; font-size: 0.92rem;
  color: var(--oro-claro);
  border-bottom: 1px solid var(--panel-borde);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}

/* ---------- Pestañas ---------- */
.pestanas { display: flex; border-bottom: 1px solid var(--panel-borde); background: var(--fondo-2); }
.pestanas button {
  flex: 1; padding: 9px 4px;
  background: transparent; border: none;
  color: var(--texto-3); font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  border-bottom: 2px solid transparent;
  transition: var(--trans);
}
.pestanas button:hover { color: var(--texto-2); }
.pestanas button.activo { color: var(--oro-claro); border-bottom-color: var(--oro); }
.panel-cuerpo { flex: 1; overflow-y: auto; overflow-x: hidden; }
.tab-panel { display: none; padding: 12px; animation: aparecer 0.25s ease; }
.tab-panel.activo { display: block; }
@keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Biblioteca ---------- */
.biblio-grupo { margin-bottom: 6px; border: 1px solid var(--panel-borde); border-radius: var(--r-s); overflow: hidden; }
.biblio-titulo {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 9px 11px; background: var(--fondo-2);
  font-size: 0.76rem; font-weight: 700; color: var(--texto); text-align: left;
  border: none; transition: var(--trans);
}
.biblio-titulo:hover { background: var(--fondo-3); }
.biblio-titulo .chevron { transition: transform var(--trans); color: var(--texto-3); }
.biblio-grupo.abierto .chevron { transform: rotate(90deg); }
.biblio-lista { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
.biblio-grupo:not(.abierto) .biblio-lista { display: none; }
.pieza {
  aspect-ratio: 1; border: 1px solid var(--panel-borde); border-radius: var(--r-s);
  background: var(--fondo-3); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; padding: 5px 3px;
  transition: var(--trans); cursor: grab; position: relative;
}
.pieza:hover { border-color: var(--oro); background: #202028; transform: translateY(-2px); box-shadow: var(--sombra-s); }
.pieza:active { cursor: grabbing; transform: scale(0.96); }
.pieza svg { width: 100%; height: 34px; fill: var(--plata); }
.pieza .etq { font-size: 0.58rem; color: var(--texto-3); text-align: center; line-height: 1.1; letter-spacing: 0.2px; }
.pieza:hover .etq { color: var(--texto-2); }

/* ---------- Lienzo central ---------- */
.lienzo-wrap { position: relative; background: radial-gradient(ellipse at 50% 40%, var(--lienzo) 0%, var(--lienzo-vinieta) 100%); overflow: hidden; }
#lienzo { width: 100%; height: 100%; display: block; touch-action: none; }
.lienzo-info {
  position: absolute; left: 14px; bottom: 12px;
  font-size: 0.7rem; color: var(--texto-3);
  background: rgba(13,13,15,0.72); padding: 5px 10px; border-radius: 20px;
  border: 1px solid var(--panel-borde); backdrop-filter: blur(6px);
  pointer-events: none; font-variant-numeric: tabular-nums;
}
.lienzo-migas {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  font-family: var(--f-titulo); font-style: italic; font-size: 0.82rem; color: var(--texto-3);
  pointer-events: none; text-align: center; max-width: 70%;
}
.zoom-flotante {
  position: absolute; right: 14px; bottom: 12px;
  display: flex; flex-direction: column; gap: 5px;
  background: rgba(19,19,23,0.86); padding: 6px; border-radius: var(--r-m);
  border: 1px solid var(--panel-borde); backdrop-filter: blur(6px); box-shadow: var(--sombra-s);
}
.zoom-flotante button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-s); background: var(--panel-elev); border: 1px solid var(--panel-borde); color: var(--texto-2); transition: var(--trans); }
.zoom-flotante button:hover { color: var(--oro-claro); border-color: var(--oro); }
.zoom-flotante svg { width: 15px; height: 15px; }

/* Manijas de selección */
.selc-caja { fill: none; stroke: var(--oro); stroke-width: 1.4; stroke-dasharray: 5 4; pointer-events: none; opacity: 0.9; }
.manija { fill: var(--fondo); stroke: var(--oro); stroke-width: 1.6; cursor: pointer; }
.manija.escala { cursor: nwse-resize; }
.manija.rotar { fill: var(--oro); cursor: grab; }
.manija-linea { stroke: var(--oro); stroke-width: 1.2; stroke-dasharray: 3 3; pointer-events: none; }
.etiqueta-did { pointer-events: none; }

/* ---------- Panel derecho: propiedades ---------- */
.campo { margin-bottom: 13px; }
.campo > label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--texto-3); font-weight: 700; margin-bottom: 5px; }
.fila { display: flex; gap: 8px; }
.fila .campo { flex: 1; margin-bottom: 0; }
.control {
  width: 100%; padding: 7px 10px;
  background: var(--fondo-3); border: 1px solid var(--panel-borde);
  border-radius: var(--r-s); color: var(--texto); font-size: 0.82rem;
  transition: var(--trans); font-variant-numeric: tabular-nums;
}
.control:focus { border-color: var(--oro); background: var(--fondo-2); }
select.control { cursor: pointer; }
input[type="range"].control { padding: 0; background: transparent; border: none; height: 22px; accent-color: var(--oro); cursor: pointer; }
.rango-fila { display: flex; align-items: center; gap: 10px; }
.rango-fila input[type=range] { flex: 1; }
.rango-val { min-width: 42px; text-align: right; font-size: 0.78rem; color: var(--texto-2); font-variant-numeric: tabular-nums; }
.acciones-obj { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 6px; }
.mini-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; background: var(--panel-elev); border: 1px solid var(--panel-borde);
  border-radius: var(--r-s); color: var(--texto-2); font-size: 0.76rem; font-weight: 600;
  transition: var(--trans);
}
.mini-btn:hover { background: var(--fondo-3); color: var(--texto); border-color: #3a3a46; }
.mini-btn svg { width: 14px; height: 14px; }
.vacio-panel { text-align: center; padding: 34px 16px; color: var(--texto-3); }
.vacio-panel svg { width: 40px; height: 40px; opacity: 0.5; margin-bottom: 10px; }
.vacio-panel p { font-size: 0.8rem; line-height: 1.5; }

/* ---------- Capas ---------- */
.capa {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 5px;
  background: var(--fondo-3); border: 1px solid var(--panel-borde);
  border-radius: var(--r-s); transition: var(--trans); cursor: pointer;
}
.capa:hover { border-color: #3a3a46; }
.capa.sel { border-color: var(--oro); background: var(--oro-tenue); }
.capa .cminiatura { width: 30px; height: 30px; flex: none; border-radius: var(--r-s); background: var(--fondo); border: 1px solid var(--panel-borde); display: grid; place-items: center; overflow: hidden; }
.capa .cminiatura svg { width: 24px; height: 24px; }
.capa .cnombre { flex: 1; min-width: 0; font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capa .cnombre small { display: block; color: var(--texto-3); font-weight: 400; font-size: 0.66rem; }
.capa .cacciones { display: flex; gap: 2px; }
.icono-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; background: transparent; border: none; color: var(--texto-3); transition: var(--trans); }
.icono-btn:hover { background: var(--fondo); color: var(--texto); }
.icono-btn svg { width: 15px; height: 15px; }
.icono-btn.on { color: var(--oro); }

/* ---------- Blasón / Interpretación ---------- */
.blason-texto {
  font-family: var(--f-titulo); font-style: italic; font-size: 0.98rem; line-height: 1.65;
  color: var(--texto); padding: 15px; background: var(--fondo-2);
  border: 1px solid var(--panel-borde); border-left: 3px solid var(--oro);
  border-radius: var(--r-s); margin-bottom: 12px;
}
.blason-texto .campo-t { color: var(--oro-claro); font-weight: 600; }
.subtitulo { font-family: var(--f-titulo); font-weight: 700; font-size: 0.86rem; color: var(--oro-claro); margin: 16px 0 8px; }
.interp-item { padding: 11px 12px; margin-bottom: 8px; background: var(--fondo-3); border: 1px solid var(--panel-borde); border-radius: var(--r-s); }
.interp-item h4 { font-size: 0.82rem; color: var(--texto); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.interp-item .punto { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,0.2); }
.interp-item p { font-size: 0.78rem; color: var(--texto-2); line-height: 1.55; }
.interp-item .prof { display: inline-block; margin-top: 6px; font-size: 0.68rem; color: var(--oro); font-style: italic; }

/* ---------- Paleta inferior ---------- */
.paleta {
  display: flex; align-items: center; gap: 18px;
  padding: 11px 20px; background: linear-gradient(0deg, #17171d, #101014);
  border-top: 1px solid var(--panel-borde); flex-wrap: wrap;
}
.paleta-grupo { display: flex; align-items: center; gap: 10px; }
.paleta-etq { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--texto-3); font-weight: 700; }
.esmaltes { display: flex; gap: 7px; flex-wrap: wrap; }
.esmalte {
  width: 30px; height: 30px; border-radius: 50%; position: relative;
  border: 2px solid rgba(255,255,255,0.14); transition: var(--trans); cursor: pointer;
}
.esmalte:hover { transform: scale(1.14) translateY(-2px); box-shadow: var(--sombra-s); }
.esmalte.sel { border-color: var(--oro); box-shadow: var(--anillo); }
.esmalte[data-clase="metal"]::after { content: "M"; }
.esmalte[data-clase="color"]::after { content: "C"; }
.esmalte::after { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.5rem; font-weight: 800; color: rgba(0,0,0,0.42); }
.esmalte[data-oscuro="1"]::after { color: rgba(255,255,255,0.5); }
.color-custom { display: flex; align-items: center; gap: 7px; }
.color-custom input[type="color"] { width: 34px; height: 34px; border: 1px solid var(--panel-borde); border-radius: var(--r-s); background: var(--fondo-3); cursor: pointer; padding: 2px; }
.color-custom input[type="text"] { width: 90px; }
.aplicar-grupo { display: flex; gap: 7px; }

/* ---------- Aviso regla esmaltes ---------- */
.aviso-esmaltes {
  position: absolute; top: 12px; right: 14px; max-width: 300px;
  background: var(--peligro-tenue); border: 1px solid var(--peligro);
  color: #f2b8b3; padding: 10px 13px; border-radius: var(--r-s);
  font-size: 0.76rem; line-height: 1.5; box-shadow: var(--sombra);
  display: flex; gap: 9px; align-items: flex-start;
  opacity: 0; transform: translateY(-8px); pointer-events: none; transition: var(--trans);
}
.aviso-esmaltes.ver { opacity: 1; transform: none; }
.aviso-esmaltes svg { width: 17px; height: 17px; flex: none; color: var(--peligro); margin-top: 1px; }
.aviso-esmaltes strong { color: #fff; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--panel-elev); border: 1px solid var(--panel-borde); border-left: 3px solid var(--oro);
  color: var(--texto); padding: 10px 16px; border-radius: var(--r-s); font-size: 0.82rem; font-weight: 500;
  box-shadow: var(--sombra); display: flex; align-items: center; gap: 9px;
  animation: toast-in 0.28s ease, toast-out 0.3s ease 2.6s forwards;
}
.toast svg { width: 16px; height: 16px; color: var(--oro); }
.toast.exito { border-left-color: var(--exito); } .toast.exito svg { color: var(--exito); }
.toast.error { border-left-color: var(--peligro); } .toast.error svg { color: var(--peligro); }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Modo didáctico: ficha imprimible ---------- */
.modal-fondo { position: fixed; inset: 0; background: rgba(6,6,8,0.78); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-fondo.ver { display: flex; }
.ficha {
  background: #faf7ef; color: #1c1913; width: min(760px, 96vw); max-height: 92vh; overflow-y: auto;
  border-radius: var(--r-m); box-shadow: 0 30px 80px rgba(0,0,0,0.6); position: relative;
}
.ficha-barra { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1a1a20; }
.ficha-barra h3 { font-family: var(--f-titulo); color: var(--oro-claro); font-size: 1rem; }
.ficha-barra .acc { display: flex; gap: 8px; }
.ficha-cuerpo { padding: 30px 40px 44px; }
.ficha-cuerpo .encabezado-ficha { text-align: center; border-bottom: 2px solid #c9a24a; padding-bottom: 18px; margin-bottom: 22px; }
.ficha-cuerpo .encabezado-ficha h2 { font-family: var(--f-titulo); font-size: 1.7rem; color: #2a230f; }
.ficha-cuerpo .encabezado-ficha p { color: #6a5f45; font-style: italic; margin-top: 4px; }
.ficha-escudo { display: flex; justify-content: center; margin: 10px 0 26px; }
.ficha-escudo svg { width: 240px; height: auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25)); }
.ficha-seccion { margin-bottom: 22px; }
.ficha-seccion h4 { font-family: var(--f-titulo); font-size: 1.05rem; color: #5c3d17; border-bottom: 1px solid #ddd0b0; padding-bottom: 5px; margin-bottom: 10px; }
.ficha-seccion p, .ficha-seccion li { font-size: 0.9rem; line-height: 1.6; color: #33301f; }
.ficha-seccion .blz { font-family: var(--f-titulo); font-style: italic; font-size: 1.05rem; color: #2a230f; }
.ficha-seccion ul { list-style: none; }
.ficha-seccion li { padding: 6px 0; border-bottom: 1px dashed #e2d8bf; display: flex; gap: 10px; }

.ficha-pie { text-align: center; color: #8a7d5c; font-size: 0.74rem; border-top: 1px solid #ddd0b0; padding-top: 14px; margin-top: 10px; }

/* ---------- Leyenda didáctica ---------- */
.leyenda { padding: 10px 12px; }
.leyenda-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 0.78rem; }

kbd { background: var(--fondo-3); border: 1px solid var(--panel-borde); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; font-size: 0.7rem; font-family: var(--f-ui); color: var(--texto-2); }

/* ---------- Responsivo ---------- */
@media (max-width: 1100px) {
  .area-trabajo { grid-template-columns: 220px 1fr 260px; }
}
@media (max-width: 860px) {
  body { overflow: auto; }

<script>
"use strict";
/* ============================================================================
 * LABORATORIO DIGITAL DE BLASONES
 * Aplicación de un solo archivo. Motor SVG + módulos por responsabilidad.
 * ========================================================================== */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const VB = { w: 600, h: 760, cx: 300, cy: 360 };   // caja del lienzo y centro del escudo
  const GRID = 25;

  const $ = (s, c) => (c || document).querySelector(s);
  const $$ = (s, c) => Array.from((c || document).querySelectorAll(s));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => "e" + Math.random().toString(36).slice(2, 9);
  const svgEl = (t, a) => { const e = document.createElementNS(NS, t); if (a) for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ==========================================================================
 * 1 · ESMALTES HERÁLDICOS (tinturas) + regla de esmaltes
 * ======================================================================== */
const ESMALTES = [
  { id: "oro",       nombre: "Oro",       de: "de oro",       hex: "#E0B848", clase: "metal", oscuro: 0, sig: "nobleza, generosidad, riqueza y constancia; la luz de la sabiduría." },
  { id: "plata",     nombre: "Plata",     de: "de plata",     hex: "#E7E8EC", clase: "metal", oscuro: 0, sig: "pureza, integridad, humildad, elocuencia y paz." },
  { id: "gules",     nombre: "Gules",     de: "de gules",     hex: "#B0242A", clase: "color", oscuro: 1, sig: "valor, fortaleza, audacia y amor a la patria; la sangre del honor." },
  { id: "azur",      nombre: "Azur",      de: "de azur",      hex: "#1F4B99", clase: "color", oscuro: 1, sig: "lealtad, justicia, verdad, perseverancia y nobleza serena." },
  { id: "sinople",   nombre: "Sinople",   de: "de sinople",   hex: "#1E7D46", clase: "color", oscuro: 1, sig: "esperanza, abundancia, libertad, cortesía y la vitalidad de la tierra." },
  { id: "purpura",   nombre: "Púrpura",   de: "de púrpura",   hex: "#6C3483", clase: "color", oscuro: 1, sig: "soberanía, dignidad, majestad y templanza." },
  { id: "sable",     nombre: "Sable",     de: "de sable",     hex: "#1B1B22", clase: "color", oscuro: 1, sig: "prudencia, sabiduría, firmeza y el duelo honroso." },
  { id: "tenne",     nombre: "Tenné",     de: "de tenné",     hex: "#B4652A", clase: "color", oscuro: 0, sig: "ambición digna y honor ganado con esfuerzo propio." },
  { id: "sanguineo", nombre: "Sanguíneo", de: "de sanguíneo", hex: "#7B241C", clase: "color", oscuro: 1, sig: "paciencia en la adversidad y victoria tras el sacrificio." },
];
const tinturaDe = (hex) => ESMALTES.find((e) => e.hex.toLowerCase() === String(hex || "").toLowerCase()) || null;

/* ==========================================================================
 * 2 · Generadores procedurales de patrones
 * ======================================================================== */
const gen = {
  sol() {
    const cx = 50, cy = 50, ri = 23, ro = 47, n = 12; let d = "";
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * 2 * Math.PI, a1 = ((i + 0.5) / n) * 2 * Math.PI, a2 = ((i + 1) / n) * 2 * Math.PI;
      d += `M${(cx + ri * Math.cos(a0)).toFixed(1)},${(cy + ri * Math.sin(a0)).toFixed(1)} L${(cx + ro * Math.cos(a1)).toFixed(1)},${(cy + ro * Math.sin(a1)).toFixed(1)} L${(cx + ri * Math.cos(a2)).toFixed(1)},${(cy + ri * Math.sin(a2)).toFixed(1)} Z `;
    }
    return `<circle cx="50" cy="50" r="25"/><path d="${d}"/>`;
  },
  rueda() {
    const cx = 50, cy = 50; let d = "";
    d += `M${cx - 42},${cy} a42,42 0 1,0 84,0 a42,42 0 1,0 -84,0 Z `;
    d += `M${cx - 31},${cy} a31,31 0 1,0 62,0 a31,31 0 1,0 -62,0 Z `;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * 2 * Math.PI, pa = a + Math.PI / 2, w = 3.4;
      const x = cx + 42 * Math.cos(a), y = cy + 42 * Math.sin(a), x2 = cx + 6 * Math.cos(a), y2 = cy + 6 * Math.sin(a);
      const wx = w * Math.cos(pa), wy = w * Math.sin(pa);
      d += `M${(x2 + wx).toFixed(1)},${(y2 + wy).toFixed(1)} L${(x + wx).toFixed(1)},${(y + wy).toFixed(1)} L${(x - wx).toFixed(1)},${(y - wy).toFixed(1)} L${(x2 - wx).toFixed(1)},${(y2 - wy).toFixed(1)} Z `;
    }
    d += `M${cx - 11},${cy} a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0 Z `;
    return `<path fill-rule="evenodd" d="${d}"/>`;
  },
  hojas(len, w) {
    const cx = 50, cy = 54, rx = 38, ry = 40, n = 13; let d = "";
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 1; i < n; i++) {
        const t = i / n, a = Math.PI / 2 + side * (t * Math.PI * 0.92);
        const bx = cx + rx * Math.cos(a), by = cy - ry * Math.sin(a), la = a - side * 0.55;
        const tx = bx + len * Math.cos(la), ty = by - len * Math.sin(la);
        const mx = (bx + tx) / 2, my = (by + ty) / 2, nx = Math.sin(la) * w, ny = Math.cos(la) * w;
        d += `M${bx.toFixed(1)},${by.toFixed(1)} Q${(mx - nx).toFixed(1)},${(my - ny).toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} Q${(mx + nx).toFixed(1)},${(my + ny).toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} Z `;
      }
    }
    return `<path d="${d}"/>`;
  },
  barry() { let d = ""; const n = 6, h = 340 / n; for (let i = 0; i < n; i += 2) d += `M0,${(i * h).toFixed(1)} H300 V${((i + 1) * h).toFixed(1)} H0 Z `; return `<path d="${d}"/>`; },
  ondaBanda(y0, y1) { let d = `M0,${y0.toFixed(1)}`; for (let x = 10; x <= 300; x += 10) d += ` L${x},${(y0 + Math.sin((x / 300) * Math.PI * 4) * 7).toFixed(1)}`; d += ` L300,${y1.toFixed(1)}`; for (let x = 290; x >= 0; x -= 10) d += ` L${x},${(y1 + Math.sin((x / 300) * Math.PI * 4) * 7).toFixed(1)}`; return d + " Z "; },
  wavy() { let d = ""; const n = 6, h = 340 / n; for (let i = 0; i < n; i += 2) d += gen.ondaBanda(i * h, (i + 1) * h); return `<path d="${d}"/>`; },
  fretty() { let d = ""; const w = 9; for (let k = -6; k <= 12; k++) { const o = k * 52; d += `M${o},0 L${o + 340},340 L${o + 340 - w * 1.4},340 L${o - w * 1.4},0 Z `; } for (let k = -6; k <= 14; k++) { const o = k * 52; d += `M${300 - o},0 L${300 - o - 340},340 L${300 - o - 340 + w * 1.4},340 L${300 - o + w * 1.4},0 Z `; } return `<path d="${d}"/>`; },

    if (this.cat === "particiones") { const d = DATOS.particiones.find((s) => s.key === this.key); return d ? d.real : ""; }
    if (this.cat === "figuras") { const d = DATOS.figuras.find((s) => s.key === this.key); return d ? d.body : ""; }
    if (this.cat === "ornamentos") { const d = DATOS.ornamentos.find((s) => s.key === this.key); return d ? d.body : ""; }

/* ==========================================================================
 * 7 · CanvasHeraldico — mesa de trabajo SVG (zoom/pan/grid/render/selección)

  _montar() {

  }
  _dibujarGrid() {
    this.capaGrid.textContent = "";

    for (let x = x0; x <= x1; x += GRID) this.capaGrid.append(svgEl("line", { x1: x, y1: y0, x2: x, y2: y1, stroke: x === VB.cx ? "rgba(212,168,83,.28)" : "rgba(255,255,255,.045)", "stroke-width": x === VB.cx ? 1.3 : 1, "vector-effect": "non-scaling-stroke" }));

  centrarVista() {

    this.panY = (r.height - VB.h * this.zoom) / 2;

  fijarZoom(z, cx, cy) {

  /* ---------- render ---------- */

  _dibujarEtiquetas() {

  /* ---------- selección + manijas ---------- */
  seleccionar(id) { this.selId = id; this.render(); app.refrescarPaneles(); }
  get sel() { return this.elementos.find((e) => e.id === this.selId) || null; }

  dibujarSeleccion() {

  /* ---------- eventos de puntero ---------- */

  }
  _onDown(e) {

    const d = { cat, key, nombre: meta ? meta.nombre : (cat === "texto" ? "Lema" : "Elemento") };
    if (cat === "escudos") { d.x = VB.cx; d.y = VB.cy; d.scale = 1.35; d.fill = ESMALTES[3].hex; d.stroke = ESMALTES[0].hex; d.sw = 3; }
    else if (cat === "particiones") { d.x = base ? base.x : VB.cx; d.y = base ? base.y : VB.cy; d.scale = base ? base.scale : 1.35; d.fill = ESMALTES[1].hex; }

    else if (cat === "ornamentos") { d.x = meta.dx; d.y = meta.dy; d.scale = meta.w; d.fill = ESMALTES[0].hex; d.stroke = "#0d0d0f"; d.sw = 1; d.flip = meta.flip || 0; }
    else if (cat === "texto") { d.x = VB.cx; d.y = 660; d.scale = 1; d.fill = ESMALTES[0].hex; d.texto = opts.texto || "LEMA"; }
    Object.assign(d, opts);

  limpiar() { this.pushHistory(); this.elementos = []; this.selId = null; app.postCambio(); }
}

/* ==========================================================================
 * 8 · BibliotecaHeraldica — panel izquierdo
 * ======================================================================== */
class BibliotecaHeraldica {
  constructor(canvas) { this.c = canvas; this.cat = "escudos"; this.cont = $("#biblioCuerpo"); this._pestanas(); this.render(); }
  _pestanas() { $$("#pestanasBiblio button").forEach((b) => b.onclick = () => { $$("#pestanasBiblio button").forEach((x) => x.classList.remove("activo")); b.classList.add("activo"); this.cat = b.dataset.cat; this.render(); }); }
  _mini(cat, item) {
    if (cat === "escudos") return `<svg viewBox="0 0 300 340"><path d="${item.path}"/></svg>`;
    if (cat === "particiones") return `<svg viewBox="0 0 300 340"><path d="M40,20 H260 V150 Q260,300 150,332 Q40,300 40,150 Z" fill="rgba(255,255,255,.08)"/>${item.real}</svg>`;
    return `<svg viewBox="0 0 100 100">${item.body}</svg>`;
  }
  render() {
    const items = DATOS[this.cat];
    const grupos = { escudos: "Formas de escudo", particiones: "Particiones del campo", figuras: "Figuras y muebles", ornamentos: "Ornamentos exteriores" };
    let html = `<div class="tab-panel activo"><div class="biblio-grupo abierto"><button class="biblio-titulo">${grupos[this.cat]} <span class="chevron">›</span></button><div class="biblio-lista">`;
    for (const it of items) html += `<button class="pieza" data-cat="${this.cat}" data-key="${it.key}" title="${it.nombre}" draggable="false">${this._mini(this.cat, it)}<span class="etq">${it.nombre}</span></button>`;
    html += `</div></div><p class="hint" style="padding:6px 4px">Haz clic para añadir al centro del escudo, o arrastra a una posición concreta.</p></div>`;
    this.cont.innerHTML = html;
    $(".biblio-titulo", this.cont).onclick = (e) => e.currentTarget.parentElement.classList.toggle("abierto");
    $$(".pieza", this.cont).forEach((p) => {
      p.addEventListener("pointerdown", (e) => app.arrastre.desdeBiblioteca(e, p.dataset.cat, p.dataset.key));
    });
  }
}

/* ==========================================================================
 * 9 · SistemaArrastre — arrastrar desde biblioteca al lienzo
 * ======================================================================== */
class SistemaArrastre {
  constructor(canvas) { this.c = canvas; }
  desdeBiblioteca(e, cat, key) {
    e.preventDefault();
    const inicio = { x: e.clientX, y: e.clientY };
    let arrastrando = false, fantasma = null;
    const mover = (ev) => {
      if (!arrastrando && Math.hypot(ev.clientX - inicio.x, ev.clientY - inicio.y) > 8) {
        arrastrando = true;
        fantasma = document.createElement("div");
        fantasma.style.cssText = "position:fixed;z-index:999;pointer-events:none;width:56px;height:56px;opacity:.85;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))";
        const it = DATOS[cat].find((x) => x.key === key);
        fantasma.innerHTML = cat === "escudos" ? `<svg viewBox="0 0 300 340" style="fill:#d4a853"><path d="${it.path}"/></svg>` : `<svg viewBox="0 0 100 100" style="fill:#d4a853">${cat === "particiones" ? it.real : it.body}</svg>`;
        document.body.append(fantasma);
      }
      if (fantasma) { fantasma.style.left = ev.clientX - 28 + "px"; fantasma.style.top = ev.clientY - 28 + "px"; }
    };
    const soltar = (ev) => {
      window.removeEventListener("pointermove", mover); window.removeEventListener("pointerup", soltar);
      if (fantasma) fantasma.remove();
      const r = this.c.svg.getBoundingClientRect();
      if (!arrastrando) {
        // toque simple: añadir al centro del escudo
        this.c.añadir(cat, key);
      } else if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        const w = this.c.aMundo(ev.clientX, ev.clientY);
        let nx = w.x, ny = w.y;
        if (this.c.snap) { nx = Math.round(nx / GRID) * GRID; ny = Math.round(ny / GRID) * GRID; }
        this.c.añadir(cat, key, { x: nx, y: ny });
      }
    };
    window.addEventListener("pointermove", mover); window.addEventListener("pointerup", soltar);
  }
}

/* ==========================================================================
 * 10 · PaletaEsmaltes — colores + regla de esmaltes
 * ======================================================================== */
class PaletaEsmaltes {
  constructor(canvas) {
    this.c = canvas; this.color = ESMALTES[0].hex;
    this._render(); this._eventos();
  }
  _render() {
    const cont = $("#esmaltes"); cont.innerHTML = "";
    ESMALTES.forEach((es) => {
      const b = document.createElement("button");
      b.className = "esmalte" + (es.hex === this.color ? " sel" : "");
      b.style.background = es.hex; b.dataset.clase = es.clase; b.dataset.oscuro = es.oscuro; b.dataset.hex = es.hex;
      b.title = `${es.nombre} — ${es.clase} · ${es.sig}`;
      b.onclick = () => this.elegir(es.hex);
      cont.append(b);
    });
  }
  elegir(hex) { this.color = hex; $("#colorCustom").value = hex; $("#colorHex").value = hex.toUpperCase(); $$("#esmaltes .esmalte").forEach((e) => e.classList.toggle("sel", e.dataset.hex.toLowerCase() === hex.toLowerCase())); }
  _eventos() {
    $("#colorCustom").oninput = (e) => this.elegir(e.target.value);
    $("#colorHex").onchange = (e) => { let v = e.target.value.trim(); if (!/^#/.test(v)) v = "#" + v; if (/^#[0-9a-fA-F]{6}$/.test(v)) this.elegir(v); else e.target.value = this.color.toUpperCase(); };
    $("#aplicarRelleno").onclick = () => this.aplicar("fill");
    $("#aplicarBorde").onclick = () => this.aplicar("stroke");
    $("#acabado").onchange = (e) => this.acabado(e.target.value);
  }
  aplicar(prop) {
    const el = this.c.sel; if (!el) { app.toast("Selecciona un elemento primero", "error"); return; }
    this.c.pushHistory();
    if (prop === "fill") el.fill = this.color;
    else { el.stroke = this.color; if (el.sw < 1) el.sw = 3; }
    app.postCambio();
    if (prop === "fill") this.verificarRegla(el);
  }
  acabado(tipo) {
    const el = this.c.sel; if (!el) return;
    // el acabado ajusta el borde para simular textura
    this.c.pushHistory();
    if (tipo === "plano") { el.stroke = "none"; el.sw = 0; }
    else if (tipo === "satinado") { el.stroke = "rgba(255,255,255,.35)"; el.sw = 1.5; }
    else if (tipo === "metalico") { el.stroke = "#fff"; el.sw = 2; }
    else if (tipo === "relieve") { el.stroke = "#000"; el.sw = 2.5; }
    app.postCambio();
  }
  verificarRegla(el) {
    const av = $("#avisoEsmaltes"), txt = $("#avisoEsmaltesTxt");
    if (!el.esCarga() && el.cat !== "particiones") { av.classList.remove("ver"); return; }
    const base = this.c.baseEscudo(); if (!base) { av.classList.remove("ver"); return; }
    const tc = tinturaDe(el.fill), tf = tinturaDe(base.fill);
    if (tc && tf && tc.clase === tf.clase) {
      txt.innerHTML = `<strong>Regla de esmaltes:</strong> se ha puesto ${tc.clase === "metal" ? "metal sobre metal" : "color sobre color"} (${tc.nombre} sobre ${tf.nombre}). La heráldica clásica lo evita para garantizar el contraste.`;
      av.classList.add("ver");
      clearTimeout(this._t); this._t = setTimeout(() => av.classList.remove("ver"), 5200);
    } else av.classList.remove("ver");
  }
}

/* ==========================================================================
 * 11 · GestorCapas — pestaña Capas

class GestorCapas {
  constructor(canvas) { this.c = canvas; }
  icono(n) {
    const I = {
      ojo: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
      ojoff: '<path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5-6M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19M1 1l22 22"/>',
      candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      abierto: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8-1"/>',
      arriba: '<path d="M12 19V5M5 12l7-7 7 7"/>',
      abajo: '<path d="M12 5v14M5 12l7 7 7-7"/>',
    };
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  }
  render() {
    const cont = $("#tabCapas");
    if (!this.c.elementos.length) { cont.innerHTML = app.vacio("No hay capas todavía", "Añade escudos y figuras desde la biblioteca."); return; }
    let html = `<p class="hint" style="margin-bottom:8px">De arriba (frente) a abajo (fondo). Arrastra elementos en el lienzo; usa las flechas para reordenar.</p>`;
    for (let i = this.c.elementos.length - 1; i >= 0; i--) {
      const el = this.c.elementos[i];
      const mini = el.cat === "texto" ? `<span style="font-family:var(--f-titulo);color:${el.fill};font-size:14px">A</span>` : `<svg viewBox="0 0 ${CAJAS[el.cat][0]} ${CAJAS[el.cat][1]}" style="fill:${el.fill}">${el.contenido()}</svg>`;
      html += `<div class="capa ${el.id === this.c.selId ? "sel" : ""}" data-id="${el.id}">
        <div class="cminiatura">${mini}</div>
        <div class="cnombre">${el.nombre}<small>${el.cat}${el.locked ? " · bloqueado" : ""}</small></div>
        <div class="cacciones">
          <button class="icono-btn ${el.visible ? "on" : ""}" data-a="ver" title="Visibilidad">${this.icono(el.visible ? "ojo" : "ojoff")}</button>
          <button class="icono-btn ${el.locked ? "on" : ""}" data-a="lock" title="Bloquear">${this.icono(el.locked ? "candado" : "abierto")}</button>
          <button class="icono-btn" data-a="up" title="Subir">${this.icono("arriba")}</button>
          <button class="icono-btn" data-a="down" title="Bajar">${this.icono("abajo")}</button>
        </div></div>`;
    }
    cont.innerHTML = html;
    $$(".capa", cont).forEach((row) => {
      const id = row.dataset.id;
      row.addEventListener("click", (e) => { if (e.target.closest("[data-a]")) return; this.c.seleccionar(id); });
      $$("[data-a]", row).forEach((b) => b.onclick = (e) => {
        e.stopPropagation(); const el = this.c.elementos.find((x) => x.id === id); const a = b.dataset.a;
        if (a === "ver") { this.c.pushHistory(); el.visible = !el.visible; app.postCambio(); }
        else if (a === "lock") { this.c.pushHistory(); el.locked = !el.locked; app.postCambio(); }
        else if (a === "up") this.c.reordenar(id, 1);
        else if (a === "down") this.c.reordenar(id, -1);

    });
  }
}

/* ==========================================================================
 * 12 · GeneradorBlasonamiento
 * ======================================================================== */
class GeneradorBlasonamiento {
  constructor(canvas) { this.c = canvas; }
  _pos(el) {
    const dx = el.x - VB.cx, dy = el.y - VB.cy, t = [];
    if (dy < -75) t.push("en el jefe"); else if (dy > 95) t.push("en la punta");
    if (dx < -65) t.push("a la diestra"); else if (dx > 65) t.push("a la siniestra");
    return t.length ? " " + t.join(", ") : "";
  }
  _t(hex) { const t = tinturaDe(hex); return t ? t.de : "de un color propio"; }
  generar() {
    const base = this.c.baseEscudo();
    if (!base) return { texto: "El escudo aún no ha sido definido. Añade una forma de escudo para comenzar.", html: "El escudo aún no ha sido definido. Añade una forma de escudo para comenzar." };
    const B = (s) => `<b class="campo-t">${s}</b>`;
    const part = this.c.elementos.find((e) => e.cat === "particiones" && e.visible);
    const campoT = this._t(base.fill);
    let texto, html;
    if (part) {
      const pn = NOMBRE_PARTICION[part.key] || part.key;
      texto = `Escudo ${pn}, ${campoT} y ${this._t(part.fill)}`;
      html = `Escudo ${B(pn)}, ${campoT} y ${this._t(part.fill)}`;
    } else {
      texto = `En campo ${campoT}`;
      html = `En campo ${B(campoT)}`;
    }
    const cargas = this.c.elementos.filter((e) => e.cat === "figuras" && e.visible);
    if (cargas.length) {
      texto += ", " + cargas.map((c) => `${c.art} ${c.nombre.toLowerCase()} ${this._t(c.fill)}${this._pos(c)}`).join("; ");
      html += ", " + cargas.map((c) => `${c.art} ${B(c.nombre.toLowerCase())} ${this._t(c.fill)}${this._pos(c)}`).join("; ");
    }
    const lemas = this.c.elementos.filter((e) => e.cat === "texto" && e.visible && e.texto);
    if (lemas.length) { const l = `. Con el lema «${lemas.map((x) => x.texto).join(" · ")}»`; texto += l; html += l; }
    const orn = this.c.elementos.filter((e) => e.cat === "ornamentos" && e.visible);
    if (orn.length) { const o = `. Ornado exteriormente con ${orn.map((x) => x.nombre.toLowerCase()).join(", ")}`; texto += o; html += o; }
    texto += "."; html += ".";
    return { texto, html };
  }
  render() {
    const cont = $("#tabBlason"); const r = this.generar();
    cont.innerHTML = `<div class="subtitulo" style="margin-top:0">Blasonamiento automático</div>
      <div class="blason-texto">${r.html || r.texto}</div>
      <p class="hint">El <b>blasonamiento</b> es la descripción técnica del escudo con el lenguaje heráldico. Se genera al vuelo a partir de tu composición. El orden de lectura es: campo, particiones, figuras (muebles) y ornamentos.</p>
      <button class="btn fantasma" id="copiarBlason" style="margin-top:10px;width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar descripción</button>`;
    $("#copiarBlason").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(r.texto); app.toast("Blasonamiento copiado", "exito"); };
  }
}

/* ==========================================================================
 * 13 · InterpreteSimbolico
 * ======================================================================== */
class InterpreteSimbolico {
  constructor(canvas) { this.c = canvas; }
  items() {
    const out = [];
    const base = this.c.baseEscudo();
    if (base) { const t = tinturaDe(base.fill); if (t) out.push({ color: t.hex, titulo: `Campo ${t.nombre}`, texto: t.sig, prof: "Tintura del campo" }); }
    const part = this.c.elementos.find((e) => e.cat === "particiones" && e.visible);
    if (part) { const t = tinturaDe(part.fill); out.push({ color: part.fill, titulo: NOMBRE_PARTICION[part.key] || part.key, texto: "La partición del campo divide el escudo, a menudo para conmemorar alianzas, uniones de linajes o dominios.", prof: "Estructura del campo" }); }
    this.c.elementos.filter((e) => e.cat === "figuras" && e.visible).forEach((f) => { const s = SIGNIFICADOS[f.key]; if (s) out.push({ color: f.fill, titulo: f.nombre, texto: s.s, prof: s.p }); });
    return out;
  }
  render() {
    const cont = $("#tabInterp"); const its = this.items();
    if (!its.length) { cont.innerHTML = app.vacio("Sin elementos que interpretar", "Añade un escudo y figuras para descubrir su lectura simbólica."); return; }
    let html = `<div class="subtitulo" style="margin-top:0">Lectura simbólica</div>`;
    for (const it of its) html += `<div class="interp-item"><h4><span class="punto" style="background:${it.color}"></span>${it.titulo}</h4><p>${it.texto}</p><span class="prof">◆ ${it.prof}</span></div>`;
    html += `<p class="hint" style="margin-top:10px">La semiótica heráldica combina el sentido de las <b>tinturas</b> con el de las <b>figuras</b>: un mismo mueble cambia de matiz según el esmalte que lo viste y su posición en el campo.</p>`;
    cont.innerHTML = html;
  }
}

/* ==========================================================================
 * 14 · GestorProyecto — guardar/cargar/exportar
 * ======================================================================== */
class GestorProyecto {
  constructor(canvas) { this.c = canvas; this.LS = "lab-blasones-proyecto-v1"; }
  serializar() { return { v: 1, fecha: Date.now(), vista: { zoom: this.c.zoom, panX: this.c.panX, panY: this.c.panY }, elementos: this.c.elementos.map((e) => e.toJSON()) }; }
  cargarDatos(data) {
    if (!data || !Array.isArray(data.elementos)) throw new Error("Formato inválido");
    this.c.elementos = data.elementos.map((d) => new ElementoHeraldico(d));
    this.c.selId = null; this.c.undoPila = []; this.c.redoPila = [];
    if (data.vista) { this.c.zoom = data.vista.zoom || 1; this.c.panX = data.vista.panX || 0; this.c.panY = data.vista.panY || 0; this.c._aplicarVista(); }
    app.postCambio();
  }
  guardarLocal() { try { localStorage.setItem(this.LS, JSON.stringify(this.serializar())); app.toast("Proyecto guardado en el navegador", "exito"); } catch (e) { app.toast("No se pudo guardar", "error"); } }
  autoguardar() { try { localStorage.setItem(this.LS, JSON.stringify(this.serializar())); } catch (e) {} }
  cargarLocal() { try { const raw = localStorage.getItem(this.LS); if (!raw) { app.toast("No hay proyecto guardado", "error"); return; } this.cargarDatos(JSON.parse(raw)); app.toast("Proyecto cargado", "exito"); } catch (e) { app.toast("Error al cargar", "error"); } }
  cargarSilencioso() { try { const raw = localStorage.getItem(this.LS); if (raw) { this.cargarDatos(JSON.parse(raw)); return true; } } catch (e) {} return false; }
  exportarJSON() { const blob = new Blob([JSON.stringify(this.serializar(), null, 2)], { type: "application/json" }); this._descargar(blob, "blason.json"); app.toast("JSON exportado", "exito"); }
  importarJSON(file) { const fr = new FileReader(); fr.onload = () => { try { this.cargarDatos(JSON.parse(fr.result)); app.toast("Proyecto importado", "exito"); } catch (e) { app.toast("Archivo no válido", "error"); } }; fr.readAsText(file); }
  _svgLimpio() {
    const s = svgEl("svg", { xmlns: NS, viewBox: `0 0 ${VB.w} ${VB.h}`, width: VB.w, height: VB.h });
    s.append(this.c.defs.cloneNode(true));
    s.append(this.c.capaElem.cloneNode(true));
    return s;
  }
  exportarSVG() { const s = this._svgLimpio(); const str = new XMLSerializer().serializeToString(s); const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + str], { type: "image/svg+xml" }); this._descargar(blob, "blason.svg"); app.toast("SVG exportado", "exito"); }
  exportarPNG() {
    const esc = 2.4; const s = this._svgLimpio(); s.setAttribute("width", VB.w * esc); s.setAttribute("height", VB.h * esc);
    const str = new XMLSerializer().serializeToString(s);
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = VB.w * esc; cv.height = VB.h * esc;
      const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0);
      cv.toBlob((b) => { this._descargar(b, "blason.png"); app.toast("PNG exportado", "exito"); }, "image/png");
    };
    img.onerror = () => app.toast("Error al generar PNG", "error");
    img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(str)));
  }
  _descargar(blob, nombre) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
}

        <div class="campo"><label>Grosor borde</label><input class="control" type="number" min="0" max="20" step="0.5" id="pSw" value="${el.sw}"></div>
      </div>
      ${(el.cat === "figuras" || el.cat === "particiones") ? `<div class="campo"><label><input type="checkbox" id="pClip" ${el.recortar ? "checked" : ""}> Recortar al contorno del escudo</label></div>` : ""}
      ${el.cat === "ornamentos" ? `<div class="campo"><label><input type="checkbox" id="pFlip" ${el.flip ? "checked" : ""}> Reflejar horizontalmente</label></div>` : ""}
      <div class="acciones-obj">
        <button class="mini-btn" id="pAtras" title="Enviar atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7 7 7-7"/></svg>Atrás</button>
        <button class="mini-btn" id="pFrente" title="Traer al frente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7-7 7 7"/></svg>Frente</button>
        <button class="mini-btn" id="pDup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Duplicar</button>
        <button class="mini-btn" id="pDel" style="color:var(--peligro)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Eliminar</button>
      </div>`;
    this._enlazarObjeto(el);
  },
  _enlazarObjeto(el) {
    const c = this.canvas;
    const H = () => c.pushHistory();
    const set = (fn) => { H(); fn(); this.postCambio(); };
    const live = (fn) => { fn(); c._actualizarNodo(el); c.dibujarSeleccion(); if (el === c.baseEscudo()) c._actualizarClip(); };
    const bind = (id, ev, fn) => { const n = $("#" + id); if (n) n.addEventListener(ev, fn); };
    bind("pNombre", "change", (e) => set(() => el.nombre = e.target.value));
    bind("pTexto", "input", (e) => { el.texto = e.target.value; live(() => {}); c.render(); c.dibujarSeleccion(); });
    bind("pTexto", "change", () => { H(); this.postCambio(); });
    bind("pX", "input", (e) => { H(); live(() => el.x = +e.target.value); });
    bind("pY", "input", (e) => { H(); live(() => el.y = +e.target.value); });
    bind("pScale", "input", (e) => { $("#pScaleV").textContent = e.target.value + "%"; live(() => el.scale = +e.target.value / 100); });
    bind("pScale", "change", H);
    bind("pRot", "input", (e) => { $("#pRotV").textContent = e.target.value + "°"; live(() => el.rot = +e.target.value); });
    bind("pRot", "change", H);
    bind("pOp", "input", (e) => { $("#pOpV").textContent = e.target.value + "%"; el.opacity = +e.target.value / 100; c._actualizarNodo(el); const g = c.nodos[el.id]; if (g) g.setAttribute("opacity", el.opacity); });
    bind("pOp", "change", () => { H(); this.postCambio(); });
    bind("pFill", "input", (e) => { el.fill = e.target.value; const g = c.nodos[el.id]; if (g) g.setAttribute("fill", el.fill); if (el === c.baseEscudo()) c._actualizarClip(); });
    bind("pFill", "change", () => { H(); this.postCambio(); this.paleta.verificarRegla(el); });
    bind("pSw", "change", (e) => set(() => el.sw = +e.target.value));
    bind("pClip", "change", (e) => set(() => el.recortar = e.target.checked));
    bind("pFlip", "change", (e) => set(() => el.flip = e.target.checked ? 1 : 0));
    bind("pAtras", "click", () => c.reordenar(el.id, -1));
    bind("pFrente", "click", () => c.reordenar(el.id, 1));
    bind("pDup", "click", () => c.duplicar(el.id));
    bind("pDel", "click", () => c.eliminar(el.id));
  },
  actualizarCampos() {
    const el = this.canvas.sel; if (!el) return;
    const s = (id, v) => { const n = $("#" + id); if (n && document.activeElement !== n) n.value = v; };
    s("pX", Math.round(el.x)); s("pY", Math.round(el.y));
    const ps = $("#pScale"); if (ps) { ps.value = Math.round(el.scale * 100); $("#pScaleV").textContent = Math.round(el.scale * 100) + "%"; }
    const pr = $("#pRot"); if (pr) { pr.value = el.rot; $("#pRotV").textContent = el.rot + "°"; }
  },

  /* ---- barra de herramientas ---- */
  _barra() {
    const c = this.canvas;
    $$('.tbtn[data-tool]').forEach((b) => b.onclick = () => { $$('.tbtn[data-tool]').forEach((x) => x.classList.remove("activo")); b.classList.add("activo"); c.tool = b.dataset.tool; $("#lienzo").style.cursor = c.tool === "mano" ? "grab" : "default"; });
    $("#tbTexto").onclick = () => { const t = prompt("Texto del lema:", "PLVS VLTRA"); if (t !== null) c.añadir("texto", "", { texto: t || "LEMA" }); };
    $("#tbDuplicar").onclick = () => c.sel && c.duplicar(c.selId);
    $("#tbEliminar").onclick = () => c.sel && c.eliminar(c.selId);
    $("#tbDeshacer").onclick = () => c.deshacer();
    $("#tbRehacer").onclick = () => c.rehacer();
    $("#tbSnap").onclick = () => { c.snap = !c.snap; $("#tbSnap").classList.toggle("activo", c.snap); };
    $("#tbGrid").onclick = () => { c.gridOn = !c.gridOn; $("#tbGrid").classList.toggle("activo", c.gridOn); c.capaGrid.style.display = c.gridOn ? "" : "none"; };
    $("#tbCentrar").onclick = () => c.centrarVista();
    $("#tbZoomIn").onclick = $("#zfIn").onclick = () => c.fijarZoom(c.zoom * 1.15);
    $("#tbZoomOut").onclick = $("#zfOut").onclick = () => c.fijarZoom(c.zoom * 0.87);
    $("#tbZoomFit").onclick = () => c.centrarVista();
  },

  /* ---- cabecera ---- */
  _cabecera() {
    $("#btnNuevo").onclick = () => { if (confirm("¿Comenzar un escudo nuevo? Se perderá lo no exportado.")) { this.canvas.limpiar(); this.canvas.añadir("escudos", "frances"); } };
    $("#btnGuardar").onclick = () => this.proyecto.guardarLocal();
    $("#btnCargar").onclick = () => this.proyecto.cargarLocal();
    $("#btnExportJSON").onclick = () => this.proyecto.exportarJSON();
    $("#btnImportar").onclick = () => $("#inputImportar").click();
    $("#inputImportar").onchange = (e) => { if (e.target.files[0]) this.proyecto.importarJSON(e.target.files[0]); e.target.value = ""; };
    $("#btnExportSVG").onclick = () => this.proyecto.exportarSVG();
    $("#btnExportPNG").onclick = () => this.proyecto.exportarPNG();
    $("#btnDidactico").onclick = () => this.didactico.alternar();
    $("#fichaCerrar").onclick = () => this.didactico.cerrarFicha();
    $("#modalFicha").onclick = (e) => { if (e.target === $("#modalFicha")) this.didactico.cerrarFicha(); };
    $("#fichaImprimir").onclick = () => window.print();
    // botón didáctico abre además la ficha con doble clic
    $("#btnDidactico").ondblclick = () => this.didactico.abrirFicha();
  },

  /* ---- teclado ---- */
  _teclado() {
    const c = this.canvas;
    window.addEventListener("keydown", (e) => {
      if (/input|textarea|select/i.test(e.target.tagName)) return;
      if (e.code === "Space") { this.espacio = true; $("#lienzo").style.cursor = "grab"; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? c.rehacer() : c.deshacer(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); c.rehacer(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") { e.preventDefault(); c.sel && c.duplicar(c.selId); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); this.proyecto.guardarLocal(); }
      else if ((e.key === "Delete" || e.key === "Backspace") && c.sel) { e.preventDefault(); c.eliminar(c.selId); }
      else if (e.key === "v" || e.key === "V") { $('.tbtn[data-tool="seleccionar"]').click(); }
      else if (e.key === "h" || e.key === "H") { $('.tbtn[data-tool="mano"]').click(); }
      else if (c.sel && !c.sel.locked && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault(); c.pushHistory(); const d = e.shiftKey ? GRID : 1;
        if (e.key === "ArrowUp") c.sel.y -= d; if (e.key === "ArrowDown") c.sel.y += d;
        if (e.key === "ArrowLeft") c.sel.x -= d; if (e.key === "ArrowRight") c.sel.x += d;
        c._actualizarNodo(c.sel); c.dibujarSeleccion(); if (c.sel === c.baseEscudo()) c._actualizarClip(); this.actualizarCampos();
      }
    });
    window.addEventListener("keyup", (e) => { if (e.code === "Space") { this.espacio = false; $("#lienzo").style.cursor = c.tool === "mano" ? "grab" : "default"; } });
  },
};

document.addEventListener("DOMContentLoaded", () => app.iniciar());
})();
</script>
</body>
</html>
