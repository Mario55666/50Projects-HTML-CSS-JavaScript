# Receptor UTP Data-Driven · SIN build (no requiere buildx).
# Usa la imagen oficial de Node y monta server.js: no construye nada.
#
# IMPORTANTE: coloca ESTE archivo (docker-compose.yml) y server.js en la
# MISMA carpeta, y crea el proyecto de Docker apuntando a esa carpeta.
# (El error "lstat /volume1/docker/Dockerfile" ocurre cuando el compose
#  intenta construir; esta versión ya no construye.)

services:
  retailmax-receiver:
    image: node:20-alpine
    container_name: retailmax-receiver
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "8080:8080"            # http://IP_DEL_NAS:8080  (cambia el primer 8080 si está ocupado)
    environment:
      - PORT=8080
      - DATA_DIR=/data
      # Token opcional (el PWA debe enviarlo como ?token=... o cabecera X-Token):
      # - INGEST_TOKEN=retailmax2025
    volumes:
      - ./server.js:/app/server.js:ro   # el código (solo lectura)
      - ./data:/data                    # carpeta persistente de envíos
